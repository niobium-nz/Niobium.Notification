name: Publish to Prod

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  SERVICE_NAME: "Niobium.Notification.Host"
  VERSION_MAJOR: 1
  VERSION_MINOR: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SERVICE_BUS_QUEUE_NAMES: 'subscribecommand,notifycommand,subscribedevent'
          APPSETTING_SERVICE_NAME: ${{ env.SERVICE_NAME }}
          APPSETTING_ASPNETCORE_HTTP_PORTS: '8080'
          APPSETTING_SERVICE_VERSION: '${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ github.run_number }}'
          APPSETTING_NOTIFICATIONOPTIONS__TEMPLATEFOLDER: 'templates'
          APPSETTING_RESENDSERVICEOPTIONS__GLOBALAPIKEY: ${{ secrets.RESEND_API_KEY }}
          APPSETTING_NOTIFICATIONOPTIONS__SELFHOSTNAME: ${{ secrets.SELF_HOSTNAME }}
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: ${{ vars.IS_CAPTCHA_DISABLED }}
          APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW.EDENNOODLESHAMILTON.CO.NZ: ${{ secrets.RECAPTCHA_WWW_EDENNOODLESHAMILTON_CO_NZ }}
          APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW.EDENNOODLESBAR.CO.NZ: ${{ secrets.RECAPTCHA_WWW_EDENNOODLESBAR_CO_NZ }}
          APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW.NIOBIUM.CO.NZ: ${{ secrets.RECAPTCHA_WWW_NIOBIUM_CO_NZ }}
          APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW.ZAPS.CO.NZ: ${{ secrets.RECAPTCHA_WWW_ZAPS_CO_NZ }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
