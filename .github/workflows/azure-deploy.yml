name: Azure Deployment

on:
  push:
    branches: ['**', '!main']
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'test-deployment' || 'production-deployment' }}
  cancel-in-progress: false
  queue: max

env:
  buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}'
  SourceRevisionId: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.merge_commit_sha }}

jobs:
  build:
    name: Build and local tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore
        run: dotnet restore Niobium.Notification.slnx --nologo
      - name: Build
        run: dotnet build Niobium.Notification.slnx --configuration Release --no-restore --nologo
      - name: Delivery policy and tooling tests
        run: |
          node --test scripts/delivery-policy.test.cjs
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Application tests with coverage
        run: dotnet test --project src/Niobium.Notification.Core.Tests/Niobium.Notification.Core.Tests.csproj --configuration Release --no-build --no-restore --report-trx --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory artifacts/unit
      - name: Check application coverage
        run: python scripts/check-coverage.py artifacts/unit/coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-evidence-${{ github.sha }}
          path: artifacts/unit/
          if-no-files-found: error

  test:
    name: Deploy test and run integration
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ENV_NAME: test
      APP_SHORT_NAME: niobiumnotify
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify test fixture configuration
        env:
          TEST_BILLER_ID: ${{ vars.TEST_BILLER_ID }}
          TEST_NOTIFICATION_RECIPIENT: ${{ secrets.TEST_NOTIFICATION_RECIPIENT }}
        run: python scripts/deployed-integration.py --check-configuration
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: Azure/setup-azd@v2
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}
      - name: Publish
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: 'test'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Notification.Server.Test'
          APPSETTING_SERVICE_VERSION: '${{ env.buildVersion }}-prerelease'
          APPSETTING_NOTIFICATIONOPTIONS__SELFHOSTNAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          APPSETTING_NOTIFICATIONOPTIONS__TEMPLATEFOLDER: 'templates'
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: 'true'
          APPSETTING_KV_RESENDSERVICEOPTIONS__GLOBALAPIKEY: ${{ secrets.APPSETTING_RESENDSERVICEOPTIONS__GLOBALAPIKEY }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
      - name: Prepare test integration credentials
        run: python scripts/test-resources.py
      - name: Run deployed integration tests
        timeout-minutes: 15
        env:
          TEST_BILLER_ID: ${{ vars.TEST_BILLER_ID }}
          TEST_NOTIFICATION_RECIPIENT: ${{ secrets.TEST_NOTIFICATION_RECIPIENT }}
        run: python scripts/deployed-integration.py --report artifacts/deployed/integration.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-test-evidence-${{ github.sha }}
          path: artifacts/deployed/
          if-no-files-found: error

  trusted-test:
    name: Verify trusted deployed integration
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ENV_NAME: test
      APP_SHORT_NAME: niobiumnotify
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Resolve reviewed test harness
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const { data: main } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            const sha = main.commit.sha;
            core.setOutput('sha', sha);
            try {
              await github.rest.repos.getContent({ ...context.repo, ref: sha, path: 'scripts/deployed-integration.py' });
              core.setOutput('available', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.warning('Main has no reviewed harness. Candidate tests are evidence only; explicit administrative installation is required.');
              core.setOutput('available', 'false');
            }
      - uses: actions/checkout@v4
        if: steps.source.outputs.available == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Azure login
        if: steps.source.outputs.available == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare trusted integration credentials
        if: steps.source.outputs.available == 'true'
        run: python scripts/test-resources.py
      - name: Run trusted deployed integration tests at ${{ steps.source.outputs.sha }}
        if: steps.source.outputs.available == 'true'
        timeout-minutes: 15
        env:
          TEST_BILLER_ID: ${{ vars.TEST_BILLER_ID }}
          TEST_NOTIFICATION_RECIPIENT: ${{ secrets.TEST_NOTIFICATION_RECIPIENT }}
        run: python scripts/deployed-integration.py --report artifacts/deployed/integration.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.available == 'true'
        with:
          name: trusted-deployed-test-evidence-${{ github.sha }}-${{ steps.source.outputs.sha }}
          path: artifacts/deployed/
          if-no-files-found: error

  prod:
    name: Deploy production and run read-only integration
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: Azure/setup-azd@v2
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}
      - name: Publish
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: 'prod'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Notification.Server.Prod'
          APPSETTING_SERVICE_VERSION: ${{ env.buildVersion }}
          APPSETTING_NOTIFICATIONOPTIONS__SELFHOSTNAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          APPSETTING_NOTIFICATIONOPTIONS__TEMPLATEFOLDER: 'templates'
          APPSETTING_CAPTCHAOPTIONS__ISDISABLED: 'false'
          APPSETTING_KV_RESENDSERVICEOPTIONS__GLOBALAPIKEY: ${{ secrets.APPSETTING_RESENDSERVICEOPTIONS__GLOBALAPIKEY }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESBAR_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESBAR_CO_NZ }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESBARMISSIONBAY_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESBARMISSIONBAY_CO_NZ }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESBARMORNINGSIDE_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESBARMORNINGSIDE_CO_NZ }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESHAMILTON_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_EDENNOODLESHAMILTON_CO_NZ }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_NIOBIUM_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_NIOBIUM_CO_NZ }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_TAPSS_CARE: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_TAPSS_CARE }}
          APPSETTING_KV_CAPTCHAOPTIONS__SECRETS__WWW_ZAPS_CO_NZ: ${{ secrets.APPSETTING_CAPTCHAOPTIONS__SECRETS__WWW_ZAPS_CO_NZ }}
          APPSETTING_KV_RESENDSERVICEOPTIONS__DOMAINSCOPEDAPIKEYS__TAPSS_CARE: ${{ secrets.APPSETTING_RESENDSERVICEOPTIONS__DOMAINSCOPEDAPIKEYS__TAPSS_CARE }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
      - name: Deploy assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy "./assets" --project-name="assets-notification-niobium-co-nz" --branch=main
      - name: Run production read-only integration tests
        env:
          READONLY_BASE_URL: https://${{ secrets.CUSTOM_DOMAIN_NAME }}
          READONLY_EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: python scripts/read-only-deployment.py --report artifacts/production-read-only.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-read-only-evidence-${{ github.event.pull_request.merge_commit_sha }}
          path: artifacts/production-read-only.json
          if-no-files-found: error
